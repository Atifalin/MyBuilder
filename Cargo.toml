[workspace]
resolver = "3"
members = [
    "crates/seed",
    "crates/schema",
    "crates/geom",
    "crates/pipeline",
    "crates/cli",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
mb-seed = { path = "crates/seed" }
mb-schema = { path = "crates/schema" }
mb-geom = { path = "crates/geom" }
mb-pipeline = { path = "crates/pipeline" }
blake3 = "1.8.7"
serde = "1.0.229"
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
