[package]
name = "mb-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
mb-bridge = { path = "../../../crates/bridge" }
mb-schema = { path = "../../../crates/schema" }
mb-terrain = { path = "../../../crates/terrain" }
serde_json = "1"

[workspace]
